# Manual public hosting on GitHub Pages. Enable it once: Settings > Pages > Source: GitHub Actions.
# Set repository variables (Settings > Secrets and variables > Actions > Variables):
#   VITE_REGISTRY_ADDRESS, VITE_ARKIV_ACCESS_KEY (public key, origin-restricted), optional VITE_THREAT_FEEDS.
# Pages cannot send custom response headers, so the CSP in public/_headers is NOT applied here.
# Prefer Vercel, Netlify or Cloudflare Pages for production, where those headers are honoured.
name: Deploy to GitHub Pages
on: workflow_dispatch
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:all
      - run: npm run build
        env:
          VITE_REGISTRY_ADDRESS: ${{ vars.VITE_REGISTRY_ADDRESS }}
          VITE_ARKIV_ACCESS_KEY: ${{ vars.VITE_ARKIV_ACCESS_KEY }}
          VITE_THREAT_FEEDS: ${{ vars.VITE_THREAT_FEEDS }}
          VITE_BASE: ./
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
